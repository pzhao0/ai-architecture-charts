# S4-backed AWS-compatible storage subchart configuration
aws-compatible-storage:
  fullnameOverride: s4
  s3:
    accessKeyId: s4admin
    secretAccessKey: s4secret
  auth:
    enabled: false
  route:
    enabled: false

sampleFileUpload:
  enabled: false
  bucket: documents
  region: us-east-1
  urls: []

notebook:
  create: true
  image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2024.2
  repo: "https://github.com/rh-ai-quickstart/RAG.git"
  pvcName: "pipeline-vol"
  embedding_model: all-MiniLM-L6-v2
  name: rag-vector-db
  version: 1.0
  # Notebook-specific S3 configuration
  s3:
    region: us-east-1
    bucket_name: llama
    accessKeyId: ""
    secretAccessKey: ""

# Secret configuration for rag-pipeline-secrets
secret:
  create: true

# Pipeline storage configuration for DataSciencePipelinesApplication
pipelineStorage:
  # Deploy S4 by default. Set false to use external S3-compatible storage.
  deployAwsCompatibleStorage: true
  # External storage configuration
  externalStorage:
    host: "minio"
    port: "9000"
    bucket: "mlpipeline"
    scheme: "http"
    s3CredentialsSecret:
      secretName: "minio"
      accessKey: "user"
      secretKey: "password"
