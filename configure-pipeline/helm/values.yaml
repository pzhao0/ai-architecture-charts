# MinIO subchart configuration (used when pipelineStorage.deployMinio is enabled)
minio:
  secret:
    user: minio_rag_user
    password: minio_rag_password
    host: minio
    port: "9000"

# S4-backed AWS-compatible storage subchart configuration
aws-compatible-storage:
  fullnameOverride: s4
  s3:
    accessKeyId: s4admin
    secretAccessKey: s4secret
  auth:
    enabled: false
  route:
    enabled: false

notebook:
  create: true
  image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2024.2
  repo: "https://github.com/rh-ai-quickstart/RAG.git"
  pvcName: "pipeline-vol"
  embedding_model: all-MiniLM-L6-v2
  name: rag-vector-db
  version: 1.0
  # Notebook-specific minio configuration
  minio:
    region: us-east-1
    bucket_name: llama

# Secret configuration for rag-pipeline-secrets
secret:
  create: true

# Pipeline storage configuration for DataSciencePipelinesApplication
pipelineStorage:
  # Keep MinIO as the default for existing consumers; S4 is available as an opt-in.
  deployMinio: true
  deployAwsCompatibleStorage: false
  # External storage configuration
  externalStorage:
    host: "minio"
    port: "9000"
    bucket: "mlpipeline"
    scheme: "http"
    s3CredentialsSecret:
      secretName: "minio"
      accessKey: "user"
      secretKey: "password"
